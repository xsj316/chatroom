<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加密聊天室</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #171e2e;
      --panel-2: #1e2740;
      --border: #2a3550;
      --text: #e6ecf7;
      --muted: #8b97b0;
      --accent: #4f8cff;
      --accent-2: #6ee7b7;
      --danger: #ff6b6b;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -100px, #1b2740 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---------------- 加入页 ---------------- */
    #joinPage {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .join-card {
      width: 100%; max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .join-card h1 { font-size: 22px; margin-bottom: 4px; }
    .join-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 26px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 13px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text); font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 9px;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .hint { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .hint code {
      background: var(--panel-2); padding: 2px 6px; border-radius: 5px; font-size: 12px;
    }
    .error {
      display: none; margin-top: 14px; padding: 10px 12px;
      background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.4);
      color: var(--danger); border-radius: 9px; font-size: 13px;
    }
    .error.show { display: block; }

    /* ---------------- 聊天页 ---------------- */
    #chatPage { display: none; height: 100vh; flex-direction: column; }
    #chatPage.active { display: flex; }
    .chat-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .chat-header .title { font-size: 16px; font-weight: 600; }
    .chat-header .room-id {
      background: var(--panel-2); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--accent-2);
    }
    .chat-header .nick { color: var(--muted); font-size: 13px; }
    .chat-header .spacer { flex: 1; }
    .chat-header .btn-sm {
      width: auto; padding: 7px 14px; font-size: 13px;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; cursor: pointer;
    }
    .chat-header .btn-sm:hover { border-color: var(--accent); }
    .chat-body { display: flex; flex: 1; overflow: hidden; }
    .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 72%; padding: 9px 13px; border-radius: 12px; line-height: 1.55; font-size: 14px; word-break: break-word; }
    .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .msg .meta .tag { margin-left: 6px; color: var(--accent-2); }
    .msg.mine { align-self: flex-end; background: #2b4a8f; border-bottom-right-radius: 4px; }
    .msg.theirs { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
    .msg.system {
      align-self: center; max-width: 90%;
      background: transparent; border: 1px dashed var(--border);
      color: var(--muted); font-size: 12px; text-align: center; padding: 6px 14px;
    }
    .msg.private { border: 1px solid #7c5cff55; }
    .msg.private .meta .tag { color: #a78bfa; }
    .composer {
      display: flex; gap: 10px; padding: 12px 20px;
      background: var(--panel); border-top: 1px solid var(--border);
    }
    .composer input {
      flex: 1; padding: 11px 14px; background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-size: 14px; outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer .btn { width: auto; padding: 11px 26px; }

    .users-panel {
      width: 220px; border-left: 1px solid var(--border);
      background: var(--panel); padding: 14px; overflow-y: auto;
    }
    .users-panel h3 { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .user-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
      transition: background .12s;
    }
    .user-item:hover { background: var(--panel-2); }
    .user-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); flex-shrink: 0; }
    .user-item .priv-tip { margin-left: auto; font-size: 11px; color: var(--muted); }
    .user-item.self { opacity: .55; cursor: default; }
    .private-bar {
      display: none; align-items: center; gap: 10px; padding: 8px 20px;
      background: rgba(124,92,255,.12); border-bottom: 1px solid #7c5cff55;
      font-size: 13px;
    }
    .private-bar.show { display: flex; }
    .private-bar .close {
      margin-left: auto; cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 6px;
    }
    .private-bar .close:hover { color: var(--danger); }
    @media (max-width: 700px) {
      .users-panel { display: none; }
      .msg { max-width: 88%; }
    }
  </style>
</head>
<body>

  <!-- ========== 加入页 ========== -->
  <div id="joinPage">
    <div class="join-card">
      <h1>🔒 加密聊天室</h1>
      <div class="sub">AES-256 端到端加密 · 无数据库 · 轻量部署</div>
      <div class="field">
        <label for="serverAddr">服务器地址</label>
        <input id="serverAddr" type="text" autocomplete="off" placeholder="http://127.0.0.1:3000">
      </div>
      <div class="field">
        <label for="roomId">房间号（不存在且密码正确时自动创建）</label>
        <input id="roomId" type="text" autocomplete="off" placeholder="例如：my-room-01">
      </div>
      <div class="field">
        <label for="nick">昵称（不使用头像）</label>
        <input id="nick" type="text" autocomplete="off" maxlength="32" placeholder="你的昵称">
      </div>
      <div class="field">
        <label for="password">房间密码</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="加入/创建房间的密码">
      </div>
      <button id="joinBtn" class="btn">加入聊天室</button>
      <div id="joinError" class="error"></div>
      <div class="hint">
        说明：群聊消息使用<b>房间密码派生密钥</b>（PBKDF2 → AES-256-GCM）加密；私聊使用 <b>ECDH P-256</b> 密钥协商。服务端只转发密文，无法查看内容。支持私聊的浏览器：Chrome / Edge / Firefox / Safari（≥ Safari 15）。
      </div>
    </div>
  </div>

  <!-- ========== 聊天页 ========== -->
  <div id="chatPage">
    <div class="chat-header">
      <span class="title">💬 聊天室</span>
      <span class="room-id" id="roomBadge">房间号</span>
      <span class="nick" id="nickBadge">昵称</span>
      <div class="spacer"></div>
      <span style="font-size:12px;color:var(--muted)" id="onlineBadge"></span>
      <button id="leaveBtn" class="btn-sm">退出</button>
    </div>
    <div class="private-bar" id="privateBar">
      <span>私聊中：<b id="privateTarget"></b></span>
      <span class="close" id="privateClose" title="结束私聊">✕</span>
    </div>
    <div class="chat-body">
      <div class="chat-main">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <input id="msgInput" type="text" autocomplete="off" placeholder="输入消息，Enter 发送">
          <button id="sendBtn" class="btn">发送</button>
        </div>
      </div>
      <div class="users-panel">
        <h3>在线用户（点击发起私聊）</h3>
        <div id="usersList"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/crypto.js"></script>
  <script src="/app.js"></script>
</body>
</html>
